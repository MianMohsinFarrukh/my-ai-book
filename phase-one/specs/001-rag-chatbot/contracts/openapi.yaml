openapi: 3.0.3
info:
  title: RAG Chatbot API
  description: API for the Retrieval-Augmented Generation chatbot that answers questions based on book content
  version: 1.0.0
  contact:
    name: RAG Chatbot Development Team
    email: team@example.com

servers:
  - url: https://api.rag-chatbot.example.com/v1
    description: Production server
  - url: https://staging-api.rag-chatbot.example.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /chat:
    post:
      summary: Send a message to the chatbot
      description: Submit a question to the RAG chatbot and receive a response based on book content
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              basic_query:
                summary: Basic query
                value:
                  query: "What is the main concept of chapter 3?"
              selected_text_query:
                summary: Query with selected text context
                value:
                  query: "Explain this concept"
                  selected_text: "The main concept is that AI systems need to be trained on diverse datasets to avoid bias."
                  context_override: true
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                basic_response:
                  summary: Basic response
                  value:
                    response: "Chapter 3 discusses the importance of diverse datasets in AI training to prevent bias."
                    session_id: "sess_abc123"
                    message_id: "msg_def456"
                    context_used:
                      - source: "docs/chapter3.md"
                        content: "AI systems need to be trained on diverse datasets to avoid bias in their outputs."
                        similarity: 0.92
                    grounding_confidence: 0.95
                    timestamp: "2025-12-16T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/{sessionId}/history:
    get:
      summary: Get chat history
      description: Retrieve the conversation history for a specific session
      operationId: getChatHistory
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            example: "sess_abc123"
          description: The session identifier
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of messages to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of messages to skip
      responses:
        '200':
          description: Chat history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  total_count:
                    type: integer
                    description: Total number of messages in the session
                  has_more:
                    type: boolean
                    description: Whether there are more messages available
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /content/ingest:
    post:
      summary: Ingest book content
      description: Process and store book content for RAG retrieval
      operationId: ingestContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
      responses:
        '202':
          description: Content ingestion started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Identifier for the ingestion job
                    example: "job_789xyz"
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                    example: "pending"
                  estimated_duration:
                    type: integer
                    description: Estimated time in seconds
                    example: 120
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feedback:
    post:
      summary: Submit feedback on a response
      description: Provide feedback to improve the chatbot's responses
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback_id:
                    type: string
                    example: "feedback_123"
                  status:
                    type: string
                    example: "received"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user's question
          example: "What is the main concept of chapter 3?"
        selected_text:
          type: string
          description: Optional selected text to limit context
          example: "The main concept is that AI systems need to be trained on diverse datasets to avoid bias."
        session_id:
          type: string
          description: Optional session identifier to continue conversation
          example: "sess_abc123"
        context_override:
          type: boolean
          description: Whether to prioritize selected_text over global retrieval
          default: false
        options:
          type: object
          properties:
            temperature:
              type: number
              minimum: 0
              maximum: 1
              default: 0.7
              description: Controls randomness in response generation
            max_tokens:
              type: integer
              minimum: 1
              maximum: 4096
              default: 1000
              description: Maximum number of tokens in the response
            response_format:
              type: string
              enum: [text, json]
              default: text
              description: Desired format of the response

    ChatResponse:
      type: object
      required:
        - response
        - session_id
        - message_id
        - grounding_confidence
        - timestamp
      properties:
        response:
          type: string
          description: The AI-generated response
          example: "Chapter 3 discusses the importance of diverse datasets in AI training to prevent bias."
        session_id:
          type: string
          description: The session identifier
          example: "sess_abc123"
        message_id:
          type: string
          description: Unique identifier for this message
          example: "msg_def456"
        context_used:
          type: array
          description: Content used to generate the response
          items:
            type: object
            required:
              - source
              - content
              - similarity
            properties:
              source:
                type: string
                description: Source document
                example: "docs/chapter3.md"
              content:
                type: string
                description: Relevant content snippet
                example: "AI systems need to be trained on diverse datasets to avoid bias in their outputs."
              similarity:
                type: number
                minimum: 0
                maximum: 1
                description: Similarity score between query and content
                example: 0.92
        grounding_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence in response grounding
          example: 0.95
        timestamp:
          type: string
          format: date-time
          description: When the response was generated
          example: "2025-12-16T10:30:00Z"

    ChatMessage:
      type: object
      required:
        - id
        - role
        - content
        - timestamp
      properties:
        id:
          type: string
          example: "msg_def456"
        role:
          type: string
          enum: [user, assistant, system]
          example: "assistant"
        content:
          type: string
          example: "Chapter 3 discusses the importance of diverse datasets in AI training to prevent bias."
        timestamp:
          type: string
          format: date-time
          example: "2025-12-16T10:30:00Z"
        context_used:
          type: array
          items:
            type: object
            required:
              - source
              - content
            properties:
              source:
                type: string
                example: "docs/chapter3.md"
              content:
                type: string
                example: "AI systems need to be trained on diverse datasets to avoid bias in their outputs."

    IngestionRequest:
      type: object
      required:
        - source_path
      properties:
        source_path:
          type: string
          description: Path to markdown files to be ingested
          example: "docs/"
        chunk_size:
          type: integer
          minimum: 100
          maximum: 10000
          default: 1000
          description: Size of content chunks in characters
        overlap:
          type: integer
          minimum: 0
          maximum: 1000
          default: 200
          description: Overlap between chunks in characters
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata for the content
          example:
            book_id: "ai-textbook-v1"
            version: "1.0.0"

    FeedbackRequest:
      type: object
      required:
        - feedback_type
      properties:
        message_id:
          type: string
          description: ID of the message being rated
          example: "msg_def456"
        session_id:
          type: string
          description: ID of the session (required if message_id not provided)
          example: "sess_abc123"
        feedback_type:
          type: string
          enum: [positive, negative, incorrect]
          description: Type of feedback
          example: "negative"
        comment:
          type: string
          description: Optional comment explaining the feedback
          example: "The response contained information not present in the book."

  responses:
    BadRequest:
      description: Bad request - invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "INVALID_INPUT"
              message: "Query parameter is required and cannot be empty"
              details:
                field: "query"
                value: ""

    UnprocessableEntity:
      description: Unprocessable entity - request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Selected text provided without context_override flag"
              details:
                field: "context_override"
                expected: "true when selected_text is provided"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "NOT_FOUND"
              message: "Chat session not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "An unexpected error occurred processing your request"

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: "INTERNAL_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "An unexpected error occurred processing your request"
            details:
              type: object
              description: Additional error details
              additionalProperties: true

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

security:
  - BearerAuth: []

tags:
  - name: chat
    description: Chatbot interaction endpoints
  - name: content
    description: Content management and ingestion
  - name: feedback
    description: User feedback submission