<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8bf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#735ce6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Robot body outline -->
  <rect x="30" y="20" width="40" height="50" rx="5" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>

  <!-- Robot head with brain pattern -->
  <circle cx="50" cy="15" r="15" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>

  <!-- Brain pattern inside head -->
  <path d="M45 10 Q50 8 55 10 Q50 12 45 10 M45 15 Q50 13 55 15 Q50 17 45 15 M45 20 Q50 18 55 20 Q50 22 45 20"
        stroke="url(#logoGradient)" stroke-width="1" fill="none"/>

  <!-- Arms -->
  <line x1="25" y1="35" x2="30" y2="35" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="25" y1="50" x2="30" y2="50" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="70" y1="35" x2="75" y2="35" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="70" y1="50" x2="75" y2="50" stroke="url(#logoGradient)" stroke-width="2"/>

  <!-- Text -->
  <text x="90" y="45" font-family="Arial, sans-serif" font-size="16" fill="url(#logoGradient)" font-weight="bold">Physical AI</text>
  <text x="90" y="65" font-family="Arial, sans-serif" font-size="12" fill="#666" font-style="italic">Humanoid Robotics</text>
</svg>