[project]
name = "book-rag-chatbot"
version = "0.1.0"
description = "RAG Chatbot for AI Book with Docusaurus Integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Book Project", email = "team@example.com"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "openai>=1.10.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "langchain>=0.0.352",
    "langchain-openai>=0.0.5",
    "tiktoken>=0.5.0",
    "aiofiles>=23.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "openai-agents>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.0.0",
    "pre-commit>=3.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000
reload = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
